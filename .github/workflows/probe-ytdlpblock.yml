name: probe-ytdlpblock
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: gemini-youtube-ingestion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python probe-ytdlpblock-gemini.py
