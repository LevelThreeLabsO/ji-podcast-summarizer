name: probe-warpegress
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-warpegress.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: install yt-dlp, deno (JS runtime yt-dlp needs), ffmpeg
        run: |
          set +e
          pip install -U yt-dlp && yt-dlp --version
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version | head -1
          mkdir -p ~/bin
          curl -sSL --retry 3 --max-time 120 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/
          mv /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe ~/bin/
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/ffmpeg -version | head -1
      - name: A. WARP up
        run: |
          set +e
          curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' | sed 's/^/no-warp /'
          curl -sL "https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64" -o wgcf && chmod +x wgcf
          ./wgcf register --accept-tos >/dev/null 2>&1 && ./wgcf generate >/dev/null 2>&1 && echo "wgcf ok"
          curl -sL "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz" -o wp.tgz
          tar xzf wp.tgz && chmod +x wireproxy
          cp wgcf-profile.conf warp.conf
          printf '\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' >> warp.conf
          nohup ./wireproxy -c warp.conf > wireproxy.log 2>&1 &
          for i in $(seq 1 20); do sleep 2; curl -s --socks5-hostname 127.0.0.1:25344 --max-time 10 https://www.cloudflare.com/cdn-cgi/trace -o t.txt && break; done
          grep -E '^(ip|warp)=' t.txt | sed 's/^/warp /' || { echo "PROXY NEVER CAME UP"; tail -5 wireproxy.log; }
      - name: B. captions through WARP, with deno available
        run: |
          set +e
          which deno; deno --version | head -1
          P=socks5h://127.0.0.1:25344
          for V in dQw4w9WgXcQ jNQXAC9IVRw 77y4dn5Dgvs bTJggsMK6uQ; do
            S=$(date +%s)
            timeout 180 yt-dlp --proxy $P --skip-download --write-auto-subs --sub-langs "en" \
              --sub-format vtt -o "c-$V" "https://www.youtube.com/watch?v=$V" >"c-$V.log" 2>&1
            E=$(( $(date +%s) - S ))
            if ls c-$V*.vtt >/dev/null 2>&1; then echo "CAP $V OK $(wc -c < $(ls c-$V*.vtt|head -1)) bytes ${E}s"
            else echo "CAP $V FAIL ${E}s: $(grep -m1 ERROR c-$V.log | cut -c1-130)"; fi
            sleep 3
          done
      - name: C. AUDIO through WARP with deno (the Whisper path) — long videos
        run: |
          set +e
          P=socks5h://127.0.0.1:25344
          for V in dQw4w9WgXcQ 77y4dn5Dgvs bTJggsMK6uQ; do
            S=$(date +%s)
            timeout 600 yt-dlp --proxy $P -f "bestaudio[ext=m4a]/bestaudio" \
              -o "a-$V.%(ext)s" "https://www.youtube.com/watch?v=$V" >"log-$V.txt" 2>&1
            E=$(( $(date +%s) - S ))
            F=$(ls a-$V.* 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>/dev/null)
              echo "AUD $V OK ${E}s file=$(du -h "$F"|cut -f1) media_sec=$D"
              S2=$(date +%s)
              ffmpeg -loglevel error -y -i "$F" -ac 1 -ar 16000 -c:a libopus -b:a 16k "o-$V.ogg"
              echo "  reencode ${V}: $(( $(date +%s) - S2 ))s -> $(du -h o-$V.ogg 2>/dev/null|cut -f1)"
            else
              echo "AUD $V FAIL ${E}s: $(grep -m1 ERROR log-$V.txt | cut -c1-130)"
            fi
          done
      - name: D. AUDIO fallback client args if C failed
        run: |
          set +e
          P=socks5h://127.0.0.1:25344
          for V in 77y4dn5Dgvs; do
            for CLIENT in android ios tv web_safari; do
              S=$(date +%s)
              timeout 300 yt-dlp --proxy $P --extractor-args "youtube:player_client=$CLIENT" \
                -f "bestaudio" -o "x-$CLIENT.%(ext)s" "https://www.youtube.com/watch?v=$V" >"xl-$CLIENT.txt" 2>&1
              F=$(ls x-$CLIENT.* 2>/dev/null | head -1)
              if [ -n "$F" ]; then echo "CLIENT $CLIENT OK $(( $(date +%s) - S ))s $(du -h "$F"|cut -f1)"
              else echo "CLIENT $CLIENT FAIL $(( $(date +%s) - S ))s: $(grep -m1 ERROR xl-$CLIENT.txt|cut -c1-120)"; fi
            done
          done
