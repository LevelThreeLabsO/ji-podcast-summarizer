name: probe-audiogroq
on: { workflow_dispatch: }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 00 - environment
        run: |
          set +e
          echo "=== RUNNER EGRESS IP / ASN ==="
          curl -s --max-time 20 https://ipinfo.io/json | head -20
          echo
          echo "=== ffmpeg ==="
          which ffmpeg || echo "ffmpeg NOT on PATH"
          ffmpeg -version 2>/dev/null | head -1
          echo "=== preinstalled yt-dlp ==="
          which yt-dlp || echo "yt-dlp NOT preinstalled"
          yt-dlp --version 2>/dev/null
          echo "=== docker ==="
          docker --version
          echo "=== node ==="
          node --version

      - name: 01 - install latest yt-dlp
        run: |
          set +e
          python -m pip install -q -U "yt-dlp[default]"
          echo "stable yt-dlp: $(yt-dlp --version)"
          python -m pip install -q -U --pre "yt-dlp[default]"
          echo "nightly yt-dlp: $(yt-dlp --version)"
          echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1)"

      - name: 02a - yt-dlp audio, player_client matrix (short video)
        run: |
          set +e
          V="https://www.youtube.com/watch?v=jNQXAC9IVRw"
          mkdir -p /tmp/m && cd /tmp/m
          for C in "DEFAULT" "tv" "web" "web_safari" "web_embedded" "mweb" "ios" "android" "android_vr" "tv_embedded" "tv_simply"; do
            echo "-------------------------------------------------"
            echo "### CLIENT: $C"
            rm -f a.*
            T0=$(date +%s)
            if [ "$C" = "DEFAULT" ]; then
              yt-dlp -x --audio-format mp3 -o "a.%(ext)s" --no-progress -- "$V" > out.txt 2> err.txt
            else
              yt-dlp -x --audio-format mp3 -o "a.%(ext)s" --no-progress \
                --extractor-args "youtube:player_client=$C" -- "$V" > out.txt 2> err.txt
            fi
            RC=$?
            T1=$(date +%s)
            if [ $RC -eq 0 ] && [ -f a.mp3 ]; then
              echo "RESULT: SUCCESS in $((T1-T0))s  size=$(stat -c%s a.mp3) bytes"
            else
              echo "RESULT: FAIL rc=$RC in $((T1-T0))s"
              echo "--- stderr (last 6) ---"
              tail -6 err.txt
            fi
          done

      - name: 02b - yt-dlp metadata-only probe
        run: |
          set +e
          for V in jNQXAC9IVRw dQw4w9WgXcQ 77y4dn5Dgvs bTJggsMK6uQ; do
            echo "### $V"
            yt-dlp --skip-download --print "%(title)s | dur=%(duration)s | %(id)s" \
              --no-progress -- "https://www.youtube.com/watch?v=$V" 2>&1 | tail -4
          done

      - name: 03 - bgutil POT provider (docker) then retry clients
        run: |
          set +e
          echo "=== starting bgutil pot provider ==="
          docker run --name bgutil -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>&1 | tail -3
          python -m pip install -q -U bgutil-ytdlp-pot-provider
          echo "plugin installed"
          for i in $(seq 1 25); do
            curl -s --max-time 3 http://127.0.0.1:4416/ping >/dev/null 2>&1 && { echo "provider up after ${i}s"; break; }
            sleep 1
          done
          curl -s --max-time 5 http://127.0.0.1:4416/ping; echo
          echo "=== provider ping done ==="
          cd /tmp/m
          for C in "DEFAULT" "web" "web_safari" "tv" "mweb" "android_vr"; do
            echo "-------------------------------------------------"
            echo "### POT + CLIENT: $C"
            rm -f p.*
            T0=$(date +%s)
            if [ "$C" = "DEFAULT" ]; then
              yt-dlp -x --audio-format mp3 -o "p.%(ext)s" --no-progress -v \
                -- "https://www.youtube.com/watch?v=jNQXAC9IVRw" > o.txt 2> e.txt
            else
              yt-dlp -x --audio-format mp3 -o "p.%(ext)s" --no-progress -v \
                --extractor-args "youtube:player_client=$C" \
                -- "https://www.youtube.com/watch?v=jNQXAC9IVRw" > o.txt 2> e.txt
            fi
            RC=$?; T1=$(date +%s)
            if [ $RC -eq 0 ] && [ -f p.mp3 ]; then
              echo "RESULT: SUCCESS in $((T1-T0))s size=$(stat -c%s p.mp3)"
            else
              echo "RESULT: FAIL rc=$RC in $((T1-T0))s"
              grep -iE "pot|po_token|bgutil|sign in|bot|403|failed" e.txt | tail -8
            fi
          done
          echo "=== provider container log ==="
          docker logs bgutil 2>&1 | tail -15

      - name: 04 - if it worked, pull a LONG video's audio
        run: |
          set +e
          cd /tmp/m
          echo "### long video 77y4dn5Dgvs"
          T0=$(date +%s)
          yt-dlp -x --audio-format mp3 -o "long.%(ext)s" --no-progress \
            -- "https://www.youtube.com/watch?v=77y4dn5Dgvs" > lo.txt 2> le.txt
          RC=$?; T1=$(date +%s)
          echo "rc=$RC elapsed=$((T1-T0))s"
          if [ -f long.mp3 ]; then
            echo "LONG AUDIO OK size=$(stat -c%s long.mp3)"
            ffprobe -v error -show_entries format=duration -of csv=p=0 long.mp3
          else
            tail -8 le.txt
          fi

      - name: 05 - fetch fallback speech audio (archive.org ~17 min)
        run: |
          set +e
          cd /tmp/m
          T0=$(date +%s)
          curl -sSL --max-time 180 -o mlk.mp3 "https://archive.org/download/MLKDream/MLKDream_64kb.mp3"
          RC=$?; T1=$(date +%s)
          echo "download rc=$RC elapsed=$((T1-T0))s size=$(stat -c%s mlk.mp3 2>/dev/null)"
          ffprobe -v error -show_entries format=duration -of csv=p=0 mlk.mp3

      - name: 06 - GROQ whisper + rate-limit headers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          cd /tmp/m
          if [ -z "$GROQ_API_KEY" ]; then echo "!! GROQ_API_KEY EMPTY"; exit 0; fi
          for F in long.mp3 a.mp3 p.mp3 mlk.mp3; do
            if [ -f "$F" ]; then SRC="$F"; break; fi
          done
          echo "source audio: $SRC ($(stat -c%s $SRC) bytes)"
          echo -n "source duration (s): "; ffprobe -v error -show_entries format=duration -of csv=p=0 "$SRC"
          echo "=== compress to opus 16k mono ==="
          T0=$(date +%s)
          ffmpeg -y -v error -i "$SRC" -vn -ac 1 -ar 16000 -c:a libopus -b:a 16k \
            -application voip -vbr on comp.opus
          RC=$?; T1=$(date +%s)
          echo "ffmpeg rc=$RC elapsed=$((T1-T0))s size=$(stat -c%s comp.opus) bytes"
          echo "=== GROQ transcription ==="
          T0=$(date +%s)
          HTTP=$(curl -s -o groq.json -w "%{http_code}" -D groq.hdr --max-time 600 \
            https://api.groq.com/openai/v1/audio/transcriptions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -F file=@comp.opus \
            -F model=whisper-large-v3-turbo \
            -F response_format=verbose_json)
          T1=$(date +%s)
          echo "HTTP=$HTTP  elapsed=$((T1-T0))s"
          echo "--- RATE LIMIT HEADERS ---"
          grep -i -E "x-ratelimit|retry-after" groq.hdr
          echo "--- BODY ---"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('groq.json'))
          except Exception:
              print('non-json:', open('groq.json').read()[:400]); raise SystemExit
          t = d.get('text','')
          print('chars:', len(t), 'segments:', len(d.get('segments') or []))
          print('duration field:', d.get('duration'))
          print(repr(t[:600]))
          PY

      - name: 07 - GROQ models + quota after second call
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          cd /tmp/m
          echo "=== whisper models available ==="
          curl -s --max-time 30 https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY" -o models.json
          python3 - <<'PY'
          import json
          d = json.load(open('models.json'))
          for m in d.get('data', []):
              i = m.get('id','')
              if 'whisper' in i or 'distil' in i:
                  print(i, '| owned_by', m.get('owned_by'), '| ctx', m.get('context_window'))
          PY
          echo
          echo "=== second call, read remaining quota ==="
          curl -s -o /dev/null -D h2.txt --max-time 300 \
            https://api.groq.com/openai/v1/audio/transcriptions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -F file=@comp.opus -F model=whisper-large-v3-turbo -F response_format=json
          grep -i -E "x-ratelimit|retry-after" h2.txt

      - name: 08 - opus size for 60-min and 120-min audio
        run: |
          set +e
          cd /tmp/m
          for MINS in 60 120; do
            SECS=$((MINS*60))
            T0=$(date +%s)
            ffmpeg -y -v error -stream_loop -1 -i mlk.mp3 -t $SECS \
              -vn -ac 1 -ar 16000 -c:a libopus -b:a 16k -application voip -vbr on \
              loop_${MINS}.opus
            T1=$(date +%s)
            SZ=$(stat -c%s loop_${MINS}.opus)
            ENC=$((T1-T0))
            echo "${MINS}min @16k -> $(python3 -c "print(f'{$SZ/1048576:.2f}')") MB  (encode ${ENC}s)"
          done
          echo "--- 120 min at other bitrates ---"
          for BR in 12k 24k 32k; do
            ffmpeg -y -v error -stream_loop -1 -i mlk.mp3 -t 7200 \
              -vn -ac 1 -ar 16000 -c:a libopus -b:a $BR -application voip -vbr on b_$BR.opus
            SZ2=$(stat -c%s b_$BR.opus)
            echo "120min @ $BR -> $(python3 -c "print(f'{$SZ2/1048576:.2f}')") MB"
          done

      - name: 09 - does GROQ accept the 120-minute file?
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          cd /tmp/m
          SZ=$(stat -c%s loop_120.opus)
          echo "uploading loop_120.opus = $(python3 -c "print(f'{$SZ/1048576:.2f}')") MB of 2h audio"
          T0=$(date +%s)
          HTTP=$(curl -s -o g120.json -w "%{http_code}" -D g120.hdr --max-time 900 \
            https://api.groq.com/openai/v1/audio/transcriptions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -F file=@loop_120.opus -F model=whisper-large-v3-turbo -F response_format=json)
          T1=$(date +%s)
          echo "HTTP=$HTTP elapsed=$((T1-T0))s"
          grep -i -E "x-ratelimit|retry-after" g120.hdr
          head -c 600 g120.json; echo

      - name: 10 - Gemini audio transcription (inline + File API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          cd /tmp/m
          if [ -z "$GEMINI_API_KEY" ]; then echo "!! GEMINI_API_KEY EMPTY"; exit 0; fi
          ffmpeg -y -v error -i mlk.mp3 -t 120 -vn -ac 1 -ar 16000 -c:a libopus -b:a 16k clip2min.opus
          echo "clip2min.opus = $(stat -c%s clip2min.opus) bytes"
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error

          KEY = os.environ["GEMINI_API_KEY"]
          MODEL = "gemini-2.5-flash"

          def post(url, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data,
                                           headers={"Content-Type": "application/json"},
                                           method="POST")
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=900) as r:
                      return r.status, json.loads(r.read()), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:800].decode("utf8", "replace"), time.time() - t0

          print("=== TEST 1: inline_data, 2-minute opus ===")
          b = base64.b64encode(open("clip2min.opus", "rb").read()).decode()
          print("base64 payload chars:", len(b))
          code, body, secs = post(
              "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s" % (MODEL, KEY),
              {"contents": [{"parts": [
                  {"text": "Transcribe this audio verbatim with timestamps."},
                  {"inline_data": {"mime_type": "audio/ogg", "data": b}}]}]})
          print("HTTP", code, "%.1fs" % secs)
          if code == 200:
              try:
                  txt = body["candidates"][0]["content"]["parts"][0]["text"]
                  print("usageMetadata:", json.dumps(body.get("usageMetadata", {})))
                  print("chars:", len(txt))
                  print(repr(txt[:500]))
              except Exception as e:
                  print("parse err", e, json.dumps(body)[:600])
          else:
              print(body if isinstance(body, str) else json.dumps(body)[:600])

          print()
          print("=== TEST 2: File API upload, full 17-minute mp3 ===")
          path = "mlk.mp3"
          size = os.path.getsize(path)
          print("uploading", path, size, "bytes")
          upload_url = None
          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/upload/v1beta/files?key=" + KEY,
              data=json.dumps({"file": {"display_name": "probe"}}).encode(),
              headers={"X-Goog-Upload-Protocol": "resumable",
                       "X-Goog-Upload-Command": "start",
                       "X-Goog-Upload-Header-Content-Length": str(size),
                       "X-Goog-Upload-Header-Content-Type": "audio/mpeg",
                       "Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  upload_url = r.headers.get("X-Goog-Upload-URL")
              print("got upload url:", bool(upload_url))
          except urllib.error.HTTPError as e:
              print("start failed", e.code, e.read()[:400])

          file_uri = None
          if upload_url:
              t0 = time.time()
              req = urllib.request.Request(
                  upload_url, data=open(path, "rb").read(),
                  headers={"Content-Length": str(size), "X-Goog-Upload-Offset": "0",
                           "X-Goog-Upload-Command": "upload, finalize"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=900) as r:
                      info = json.loads(r.read())
                  print("upload took %.1fs" % (time.time() - t0))
                  f = info.get("file", {})
                  file_uri = f.get("uri")
                  print("uri:", file_uri, "state:", f.get("state"))
                  for _ in range(40):
                      if f.get("state") == "ACTIVE":
                          break
                      time.sleep(2)
                      u = "https://generativelanguage.googleapis.com/v1beta/%s?key=%s" % (f.get("name"), KEY)
                      with urllib.request.urlopen(u, timeout=60) as r2:
                          f = json.loads(r2.read())
                  print("final state:", f.get("state"))
              except urllib.error.HTTPError as e:
                  print("upload failed", e.code, e.read()[:400])

          if file_uri:
              code, body, secs = post(
                  "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s" % (MODEL, KEY),
                  {"contents": [{"parts": [
                      {"text": "Transcribe this audio verbatim. Put a [mm:ss] timestamp at the start of each paragraph."},
                      {"file_data": {"mime_type": "audio/mpeg", "file_uri": file_uri}}]}]})
              print("HTTP", code, "%.1fs" % secs)
              if code == 200:
                  try:
                      txt = body["candidates"][0]["content"]["parts"][0]["text"]
                      print("usageMetadata:", json.dumps(body.get("usageMetadata", {})))
                      print("chars:", len(txt))
                      print(repr(txt[:700]))
                  except Exception as e:
                      print("parse err", e, json.dumps(body)[:600])
              else:
                  print(body if isinstance(body, str) else json.dumps(body)[:800])
          PY

      - name: 11 - Gemini direct YouTube URL ingestion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          KEY = os.environ["GEMINI_API_KEY"]
          for MODEL in ["gemini-2.5-flash", "gemini-2.0-flash"]:
              for V in ["https://www.youtube.com/watch?v=jNQXAC9IVRw",
                        "https://www.youtube.com/watch?v=77y4dn5Dgvs"]:
                  payload = {"contents": [{"parts": [
                      {"text": "Transcribe the spoken audio of this video verbatim with [mm:ss] timestamps."},
                      {"file_data": {"file_uri": V}}]}]}
                  req = urllib.request.Request(
                      "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s" % (MODEL, KEY),
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json"}, method="POST")
                  t0 = time.time()
                  try:
                      with urllib.request.urlopen(req, timeout=900) as r:
                          d = json.loads(r.read())
                      txt = d["candidates"][0]["content"]["parts"][0]["text"]
                      print("[%s] %s  HTTP 200  %.1fs  chars=%d" % (MODEL, V, time.time() - t0, len(txt)))
                      print("  usage:", json.dumps(d.get("usageMetadata", {})))
                      print("  ", repr(txt[:400]))
                  except urllib.error.HTTPError as e:
                      print("[%s] %s  HTTP %s  %.1fs" % (MODEL, V, e.code, time.time() - t0))
                      print("  ", e.read()[:500].decode("utf8", "replace"))
                  except Exception as e:
                      print("[%s] %s  ERR %s %s" % (MODEL, V, type(e).__name__, e))
                  print()
          PY

      - name: 12 - caption-path cross-check
        run: |
          set +e
          cd /tmp/m
          python -m pip install -q youtube-transcript-api
          python3 - <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi as A
          for v in ["jNQXAC9IVRw", "dQw4w9WgXcQ", "77y4dn5Dgvs"]:
              try:
                  try:
                      t = A().fetch(v)
                      print(v, "OK segments=", len(t.to_raw_data()))
                  except AttributeError:
                      t = A.get_transcript(v)
                      print(v, "OK segments=", len(t))
              except Exception as e:
                  print(v, "FAIL", type(e).__name__, str(e)[:250].replace("\n", " "))
          PY
          echo "--- yt-dlp subtitle-only path ---"
          for V in jNQXAC9IVRw 77y4dn5Dgvs; do
            rm -f s.*
            yt-dlp --skip-download --write-auto-sub --write-sub --sub-lang "en.*" \
              --sub-format json3 -o "s" --no-progress -- "https://www.youtube.com/watch?v=$V" 2>&1 | tail -3
            ls -la s.* 2>/dev/null || echo "  no subtitle file for $V"
          done

      - name: 13 - END-TO-END timing, real long video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          cd /tmp/m
          V="https://www.youtube.com/watch?v=77y4dn5Dgvs"
          echo "=== E2E for $V ==="
          W0=$(date +%s)
          T0=$(date +%s)
          rm -f e2e.*
          yt-dlp -f "bestaudio" -o "e2e.%(ext)s" --no-progress -- "$V" > e1.txt 2> e2.txt
          RC=$?; T1=$(date +%s)
          echo "STEP download: rc=$RC $((T1-T0))s"
          if [ $RC -ne 0 ]; then
            tail -6 e2.txt
            echo "E2E ABORTED - YouTube audio unavailable from this runner"
            exit 0
          fi
          F=$(ls e2e.* | head -1)
          echo "  file=$F size=$(stat -c%s $F)"
          echo -n "  duration(s): "; ffprobe -v error -show_entries format=duration -of csv=p=0 "$F"
          T0=$(date +%s)
          ffmpeg -y -v error -i "$F" -vn -ac 1 -ar 16000 -c:a libopus -b:a 16k \
            -application voip -vbr on e2e.opus
          T1=$(date +%s)
          echo "STEP compress: $((T1-T0))s size=$(stat -c%s e2e.opus)"
          T0=$(date +%s)
          HTTP=$(curl -s -o e2e.json -w "%{http_code}" -D e2e.hdr --max-time 900 \
            https://api.groq.com/openai/v1/audio/transcriptions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -F file=@e2e.opus -F model=whisper-large-v3-turbo -F response_format=verbose_json)
          T1=$(date +%s)
          echo "STEP groq: HTTP=$HTTP $((T1-T0))s"
          grep -i -E "x-ratelimit" e2e.hdr
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('e2e.json'))
              t = d.get('text', '')
              print('  transcript chars:', len(t), 'segments:', len(d.get('segments') or []))
              print('  ', repr(t[:400]))
          except Exception as e:
              print('  parse fail', e, open('e2e.json').read()[:300])
          PY
          W1=$(date +%s)
          echo "=== TOTAL E2E WALL CLOCK: $((W1-W0))s ==="
