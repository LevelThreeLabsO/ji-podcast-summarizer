name: probe gemini video tier
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL to summarize via the Gemini video tier
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Dry-run one URL
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_TRANSCRIPT_IO_TOKEN: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
          YT_QUOTA_ALERT_CHANNEL: ${{ secrets.YT_QUOTA_ALERT_CHANNEL }}
          # CLIPMAKER deliberately OMITTED so the Mac tier cannot mask a
          # failure in the Gemini video tier. If the tier is broken this run
          # must fail, not quietly fall through to ClipMaker.
        run: python3 -u poll.py --url "${{ inputs.url }}"
