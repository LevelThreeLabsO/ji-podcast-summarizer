name: Probe youtube-transcript.io credits

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe API
        env:
          TOKEN: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
        run: |
          set +x
          probe() {
            local label="$1"; shift
            echo ""
            echo "########## PROBE: $label"
            code=$(curl -s -o /tmp/body -D /tmp/hdr -w '%{http_code}' "$@" || echo "CURL_ERR")
            echo "STATUS: $code"
            echo "HEADERS:"
            sed "s|${TOKEN}|[REDACTED]|g" /tmp/hdr | sed 's/\r$//' | grep -vi "^report-to\|^nel:\|^alt-svc\|^strict-trans\|^cache-control\|^vary:" | head -25
            echo "BODY (first 300 bytes):"
            sed "s|${TOKEN}|[REDACTED]|g" /tmp/body | head -c 300
            echo ""
            echo "BODYLEN: $(wc -c < /tmp/body) bytes"
          }

          U=https://www.youtube-transcript.io/api/transcripts
          AUTH="Authorization: Basic ${TOKEN}"
          CT="Content-Type: application/json"

          # 1. The EXACT video that returned 402 in production at 17:11:07 UTC today
          probe "1) bTJggsMK6uQ (the video that 402'd in prod today)" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["bTJggsMK6uQ"]}'

          # 2. Rick Astley - the one that returned 200 in probe #1
          probe "2) dQw4w9WgXcQ (returned 200 ten minutes after prod got 402)" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["dQw4w9WgXcQ"]}'

          # 3. Repeat the same famous video - if credits gate each call, a zero
          #    balance could not serve it twice.
          probe "3) dQw4w9WgXcQ AGAIN (repeat-call test)" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["dQw4w9WgXcQ"]}'

          # 4. Another extremely famous / certainly-cached video
          probe "4) jNQXAC9IVRw (Me at the zoo - first YouTube video ever)" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["jNQXAC9IVRw"]}'

          # 5. Both together in one request - does it return partial results?
          probe "5) BOTH ids in one request" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["dQw4w9WgXcQ","bTJggsMK6uQ"]}'

          # 6. The v2 route the site advertises in window.pRoutes
          probe "6) /api/transcripts/v2 with bTJggsMK6uQ" \
            -X POST https://www.youtube-transcript.io/api/transcripts/v2 \
            -H "$AUTH" -H "$CT" -d '{"ids":["bTJggsMK6uQ"]}'

          # 7. v2 with the cached video
          probe "7) /api/transcripts/v2 with dQw4w9WgXcQ" \
            -X POST https://www.youtube-transcript.io/api/transcripts/v2 \
            -H "$AUTH" -H "$CT" -d '{"ids":["dQw4w9WgXcQ"]}'

          # 8. bTJggsMK6uQ once more - is the 402 stable for this id?
          probe "8) bTJggsMK6uQ again (is the 402 stable per-video?)" \
            -X POST $U -H "$AUTH" -H "$CT" -d '{"ids":["bTJggsMK6uQ"]}'

          echo ""
          echo "PROBE COMPLETE"
