name: probe ioapi quota
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Video id to probe
        required: false
        default: AhEZeU8ujhc
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Probe ioapi language options
        env:
          YT_TRANSCRIPT_IO_TOKEN: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
          VID: ${{ inputs.video_id }}
        run: |
          python3 -u - <<'PY'
          import os, json, requests
          tok=os.environ["YT_TRANSCRIPT_IO_TOKEN"]; vid=os.environ.get("VID") or "AhEZeU8ujhc"
          H={"Authorization":f"Basic {tok}","Content-Type":"application/json"}
          def show(label, body):
              try:
                  r=requests.post("https://www.youtube-transcript.io/api/transcripts",
                                  headers=H, json=body, timeout=90)
              except Exception as e:
                  print(f"  {label}: EXC {e}"); return
              print(f"  {label}: HTTP {r.status_code}")
              if not r.ok:
                  print("    body:", (r.text or "")[:200]); return
              try: d=r.json()
              except Exception: print("    non-JSON"); return
              item = d[0] if isinstance(d,list) and d else {}
              tr = item.get("tracks") or []
              print(f"    tracks: {[{k:v for k,v in t.items() if k!='transcript'} for t in tr]}")
              for t in tr:
                  seg=(t.get('transcript') or [])[:1]
                  print(f"    first seg of {t.get('language')}: {str(seg)[:120]}")
          show("plain {ids}", {"ids":[vid]})
          show("with languages=[en]", {"ids":[vid], "languages":["en"]})
          show("with lang=en", {"ids":[vid], "lang":"en"})
          show("with language=en", {"ids":[vid], "language":"en"})
          PY
