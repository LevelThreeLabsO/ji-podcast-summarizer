name: One-off secret transfer
# TEMPORARY — delete immediately after one run.
on: { workflow_dispatch: }
jobs:
  xfer:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.XFER_PAT }}
          VALUE: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${VALUE:-}" ] || { echo "source empty"; exit 1; }
          printf '%s' "$VALUE" | gh secret set YT_TRANSCRIPT_IO_TOKEN \
            -R LevelThreeLabsO/ejp-podcast-summarizer
          echo "copied (value not shown)"
