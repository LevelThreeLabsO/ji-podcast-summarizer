name: One-off secret transfer

# TEMPORARY. Copies YT_TRANSCRIPT_IO_TOKEN from this repo's secret store into
# the Circuit summarizer's, without ever printing it. Delete this file and the
# XFER_PAT secret as soon as it has run once.
on:
  workflow_dispatch:

jobs:
  xfer:
    runs-on: ubuntu-latest
    steps:
      - name: Copy YT_TRANSCRIPT_IO_TOKEN to circuit-podcast-summarizer
        env:
          GH_TOKEN: ${{ secrets.XFER_PAT }}
          VALUE: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VALUE:-}" ]; then
            echo "source secret is empty — nothing to copy"; exit 1
          fi
          # Piped via stdin so the value never lands in argv or the log.
          printf '%s' "$VALUE" | gh secret set YT_TRANSCRIPT_IO_TOKEN \
            -R LevelThreeLabsO/circuit-podcast-summarizer
          echo "copied (value not shown)"
